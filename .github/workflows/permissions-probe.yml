name: Probe release permissions

# THROWAWAY — delete this file once it has run green.
#
# The org sets the default GITHUB_TOKEN to read-only and the repo can't override
# it. A workflow-level `permissions:` block should still be able to request more,
# which is what release.yml relies on. This proves it in ~15s instead of finding
# out after a 20-minute release build.
#
# Runs automatically when this file is pushed, on whatever branch — a
# workflow_dispatch button would only appear once the file is on main.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/permissions-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # A *draft* release does not create the git tag, so this leaves nothing
      # behind even if the delete somehow doesn't run.
      - name: Create then delete a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create permissions-probe --repo "$GITHUB_REPOSITORY" \
            --draft --title "probe" --notes "throwaway"
          gh release delete permissions-probe --repo "$GITHUB_REPOSITORY" --yes
          echo "GITHUB_TOKEN can create releases — release.yml will work."

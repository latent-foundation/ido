[package]
name = "ido-ui"
version = "1.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Reading the clicked anchor in the rendered markdown (link interception).
# HtmlTextAreaElement: cursor position for ↑/↓ block navigation and Backspace-merge.
# DragEvent/DomRect/NodeList: measuring card positions for the kanban drop indicator.
# Document/Navigator/Clipboard: editor context-menu cut/copy/paste (execCommand + clipboard).
# ClipboardEvent/DataTransfer/File/FileList/Blob: pulling pasted/dropped images out of
# `on:paste`/`on:drop` and reading their bytes (see `components::mainpane::attachments`).
# HtmlInputElement: imperative value/caret writes for the tags-autocomplete popover
# (`components::tasks::tagsinput`), the same uncontrolled-input idiom as the column quick-add.
web-sys = { version = "0.3", features = [
    "Element",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "DragEvent",
    "MouseEvent",
    "Node",
    "NodeList",
    "DomRect",
    "Window",
    "Document",
    "Navigator",
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
    "File",
    "FileList",
    "Blob",
] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
# Markdown → HTML for the reading view (pure Rust, WASM-friendly).
pulldown-cmark = { version = "0.13", default-features = false, features = [
    "html",
] }
# LaTeX → MathML for inline ($…$) and display ($$…$$) math (pure Rust, WASM-friendly).
latex2mathml = "0.2"
# Shared latent. UI — pinned git dep; use a [patch] override for local dev:
latent-ui = { git = "https://github.com/latent-foundation/latent-ui", tag = "v0.2.0" }

[workspace]
members = ["src-tauri", "crates/ido-store", "crates/ido-mcp"]


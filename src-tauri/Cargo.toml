[package]
name = "ido"
version = "0.1.0"
description = "ido is a minimalistic productivity tool for managing tasks and projects, with notes and wikis."
authors = ["Maksymilian Neumann <neumann.maks@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `.ido/well.toml` well manifest (read/write).
toml = "1.1.2"
# Encoding image bytes as `data:` URIs for inline rendering (see `assets`).
base64 = "0.22"
# Local "today" for stamping `completed:` on a task's status transition.
chrono = "0.4"
# Counting task-list checkboxes in a task body (`- [ ]`/`- [x]`) via parser
# events rather than line scanning, so fenced-code `- [ ]` is never counted —
# same version as the frontend (`Cargo.toml`), no HTML rendering needed here.
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

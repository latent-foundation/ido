[package]
name = "ido"
# The single source of truth for the app version: `tauri.conf.json` deliberately
# omits `version`, so Tauri derives the bundle/installer version from here.
# A release tag `vX.Y.Z` must match this.
version = "1.1.0"
description = "ido is a minimalistic productivity tool for managing tasks and projects, with notes and wikis."
authors = ["Maksymilian Neumann <neumann.maks@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The tauri-free local-first store (notes/wiki/tasks/wells/search/session);
# this crate wraps it in `#[tauri::command]`s. See `crates/ido-store`.
ido-store = { path = "../crates/ido-store" }

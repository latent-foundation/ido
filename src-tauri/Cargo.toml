[package]
name = "ido"
# Inherited from the workspace (`../../Cargo.toml`), which is the single
# source of truth for the app version. Tauri derives the bundle/installer
# version from this crate, so bumping the workspace bumps the installer.
version.workspace = true
description = "ido is a minimalistic productivity tool for managing tasks and projects, with notes and wikis."
authors = ["Maksymilian Neumann <neumann.maks@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# In-app semantic search (docs/mcp-server.md P3) — the model download, the
# index build, and hybrid queries in the Ctrl+K palette. **On by default**:
# it is a headline feature of the app, so the graceful-degradation path in
# `semantic.rs` exists for builds that deliberately turn it off, not for the
# normal case. Costs the candle tree (a ~2-minute cold compile, cached after)
# and ~5 MB of binary; the model weights are never in the executable.
default = ["semantic"]
semantic = ["ido-store/semantic"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The tauri-free local-first store (notes/wiki/tasks/wells/search/session);
# this crate wraps it in `#[tauri::command]`s. See `crates/ido-store`.
ido-store = { path = "../crates/ido-store" }

[dev-dependencies]
# Tempdir wells for the semantic refresh tests (the store's own suite uses it
# the same way).
tempfile = "3"
